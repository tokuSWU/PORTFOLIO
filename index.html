<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokupu Swu Portfolio Spiral Flipbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen drafting table. A wire-bound book sits centred on grid paper;
   a thin title rail above, page controls and a filmstrip of spreads below. Single theme by choice. */
:root{
  color-scheme: light;
  --table:#e9e8e4;        /* drafting-table surface */
  --grid:#d6d4ce;         /* grid-paper lines */
  --ink:#1d1c1f;          /* text and book cover */
  --muted:#6f6c68;        /* secondary labels */
  --pen:#e0312f;          /* the red pen from the cover lettering */
  --paper:#ffffff;        /* page stock */
  --hole:#3a393c;         /* punched holes, table in shadow */
  --font-display:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--table);
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink);
  font-family:var(--font-mono);
  font-size:12px;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--pen);outline-offset:2px}

/* title rail */
.rail{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 20px;
}
.name{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.name h1{
  margin:0;font-family:var(--font-display);font-weight:800;font-size:17px;
  letter-spacing:-.01em;text-transform:uppercase;
}
.name span{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.tools{display:flex;gap:8px;flex-shrink:0}
.tool{
  background:var(--paper);border:1px solid var(--ink);border-radius:2px;
  padding:7px 11px;letter-spacing:.06em;text-transform:uppercase;font-size:11px;
}
.tool:hover,.tool[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* stage and book */
.stage{position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;padding:0 16px}
.rig{transition:transform .25s ease;will-change:transform}
.rig.zoomed{transition:transform .08s linear;cursor:zoom-out}
.book{
  position:relative;touch-action:none;user-select:none;-webkit-user-select:none;
  cursor:grab;will-change:transform;
}
/* soft shadow on the table; script resizes it to whatever the book covers as the covers swing */
.ground{
  position:absolute;top:0;bottom:0;z-index:0;pointer-events:none;border-radius:2px;
  box-shadow:0 30px 50px -18px rgba(29,28,31,.55),0 8px 14px rgba(29,28,31,.25);
}
.base,.leaf{position:absolute;top:0;height:100%;width:50%}
.base{z-index:1;background:var(--paper);overflow:hidden}
.base.l{left:0}
.base.r{left:50%}
.leaf{left:calc(50% + var(--g));width:calc(50% - var(--g));transform-origin:calc(-1 * var(--g)) center;transform-style:preserve-3d;z-index:2}
.face{
  position:absolute;inset:0;background:var(--paper);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face.back{transform:rotateY(180deg)}
/* each sheet is wider than the artwork: a blank binding strip at the spine holds the holes,
   and the square artwork sits against the outer edge at full size */
.face img{position:absolute;top:0;height:100%;width:auto;aspect-ratio:1/1;pointer-events:none;-webkit-user-drag:none}
.face.front img{right:0}
.face.back img{left:0}
/* the page block shows its edges under the first and last sheets */
.leaf.first .face.back,.leaf.last .face.front{
  box-shadow:2px 2px 0 #f3f2ef,4px 3px 0 #dddbd6,6px 5px 0 #f3f2ef;
}
/* punched holes along the binding edge of every page */
.face::before{
  content:"";position:absolute;top:0;bottom:0;width:calc(var(--hi) * 2);z-index:1;pointer-events:none;
  background:radial-gradient(circle at center,var(--hole) 0,var(--hole) var(--hr),transparent calc(var(--hr) + .7px)) left top / calc(var(--hi) * 2) var(--pitch) repeat-y;
}
.face.front::before{left:0}
.face.back::before{right:0}
/* twin-loop wire: sits above every page, each loop runs from a left hole to a right hole */
.rings{position:absolute;top:0;bottom:0;left:calc(50% - var(--g) - var(--hi));width:calc((var(--g) + var(--hi)) * 2);z-index:500;pointer-events:none}
.ring{
  position:absolute;left:0;right:0;height:calc(var(--hr) * 1.7);transform:translateY(-50%);
  border-radius:99px;
  background:linear-gradient(to bottom,#6a6a70 0,#1d1c1f 30%,transparent 31%,transparent 62%,#6a6a70 63%,#1d1c1f 92%,#000 100%);
  filter:drop-shadow(0 1.5px 1px rgba(29,28,31,.35));
}
/* gutter shadow at the spine, plus a dimmer that follows the flip angle */
.base::after,.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.base.r::after,.face.front::after{
  background:
    linear-gradient(to right,rgba(29,28,31,.10),transparent 7%),
    rgba(29,28,31,var(--dim,0));
}
.base.l::after,.face.back::after{
  background:
    linear-gradient(to left,rgba(29,28,31,.10),transparent 7%),
    rgba(29,28,31,var(--dim,0));
}

/* controls */
.deck{padding:10px 20px 14px;display:grid;gap:10px;justify-items:center}
.pager{display:flex;align-items:center;gap:14px}
.arrow{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--ink);background:var(--paper);
  display:grid;place-items:center;font-size:16px;line-height:1;
}
.arrow:hover:not(:disabled){background:var(--pen);border-color:var(--pen);color:var(--paper)}
.arrow:disabled{opacity:.3;cursor:default}
.count{font-variant-numeric:tabular-nums;letter-spacing:.08em;text-transform:uppercase;min-width:13ch;text-align:center}
.count b{font-weight:500;color:var(--pen)}
.hint{color:var(--muted);margin:0;text-align:center}
.strip{
  display:flex;gap:8px;max-width:100%;overflow-x:auto;padding:4px 2px 6px;
  scrollbar-width:thin;
}
.thumb{
  flex:0 0 auto;padding:0;border:1px solid var(--grid);background:var(--paper);
  position:relative;border-radius:1px;--th:46px;
}
.thumb img{display:block;height:var(--th);width:auto}
.thumb i{
  position:absolute;left:3px;bottom:2px;font-style:normal;font-size:9px;color:var(--muted);
  background:rgba(255,255,255,.85);padding:0 3px;font-variant-numeric:tabular-nums;
}
.thumb:hover{border-color:var(--ink)}
.thumb:focus-visible{outline-color:var(--ink)}
.thumb[aria-current="true"]{border-color:var(--pen);box-shadow:0 0 0 1px var(--pen)}
.thumb[aria-current="true"] i{color:var(--pen)}

@media (max-width:560px){
  .rail{padding:12px 16px}
  .name span{display:none}
  .deck{padding:8px 16px 12px}
  .thumb{--th:36px}
  #fsBtn{display:none}
}
@media (max-height:520px){
  .hint{display:none}
  .thumb{--th:30px}
  .rail{padding:8px 16px}
}
</style>
</head>
<body>
  <header class="rail">
    <div class="name">
      <h1>Tokupu Swu</h1>
      <span>Architecture portfolio, spiral bound</span>
    </div>
    <div class="tools">
      <button class="tool" id="zoomBtn" type="button" aria-pressed="false">Zoom in</button>
      <button class="tool" id="sndBtn" type="button">Sound: on</button>
      <button class="tool" id="fsBtn" type="button">Full screen</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="rig" id="rig">
      <div class="book" id="book" role="group" aria-label="Portfolio flipbook"></div>
    </div>
  </main>

  <footer class="deck">
    <div class="pager">
      <button class="arrow" id="prev" type="button" aria-label="Previous page">&#8592;</button>
      <div class="count" id="count" aria-live="polite"></div>
      <button class="arrow" id="next" type="button" aria-label="Next page">&#8594;</button>
    </div>
    <p class="hint" id="hint">Click the cover to open. Drag a page to turn it, or use the arrow keys.</p>
    <nav class="strip" id="strip" aria-label="All spreads"></nav>
  </footer>

<script>
(function(){
  var N = 13;                      // pages in the PDF: cover, 11 spreads, back cover
  var L = N - 1;                   // turning leaves
  var book = document.getElementById('book');
  var rig = document.getElementById('rig');
  var stage = document.getElementById('stage');
  var strip = document.getElementById('strip');
  var count = document.getElementById('count');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');
  var zoomBtn = document.getElementById('zoomBtn');
  var fsBtn = document.getElementById('fsBtn');
  var hint = document.getElementById('hint');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function img(src, alt){
    var im = new Image();
    im.decoding = 'async'; im.draggable = false; im.alt = alt; im.src = src;
    return im;
  }
  function div(cls){ var d = document.createElement('div'); d.className = cls; return d; }

  // 12 leaves, 13 states. State 0 is the closed front cover, state 12 the closed back cover,
  // states 1 to 11 are PDF spreads 2 to 12.
  // leaf 0: front = cover, back = left page of spread 2
  // leaf i: front = right page of spread i+1, back = left page of spread i+2 (the last back is the back cover)
  var leaves = [], angle = [], moving = [], raf = [];
  var ground = div('ground'); book.appendChild(ground);
  for (var i = 0; i < L; i++){
    var leaf = div('leaf');
    if (i === 0 || i === L - 1){
      leaf.className = 'leaf ' + (i === 0 ? 'first' : 'last');
    }
    var f = div('face front');
    f.appendChild(i === 0 ? img('p/01a.jpg', 'Front cover') : img('p/' + pad(i + 1) + 'b.jpg', 'Spread ' + (i + 1) + ', right page'));
    var b = div('face back');
    b.appendChild(i === L - 1 ? img('p/' + pad(N) + 'a.jpg', 'Back cover') : img('p/' + pad(i + 2) + 'a.jpg', 'Spread ' + (i + 2) + ', left page'));
    leaf.appendChild(f); leaf.appendChild(b);
    book.appendChild(leaf);
    leaves.push(leaf); angle.push(0); moving.push(false); raf.push(0);
  }

  var RINGS = 30;
  var rings = div('rings');
  for (var k = 0; k < RINGS; k++){
    var ring = div('ring'); ring.style.top = ((k + .5) / RINGS * 100) + '%';
    rings.appendChild(ring);
  }
  book.appendChild(rings);

  var thumbs = [];
  for (var s = 0; s < N; s++){
    (function(s){
      var t = document.createElement('button');
      t.type = 'button'; t.className = 'thumb';
      t.setAttribute('aria-label', s === 0 ? 'Go to front cover' : s === N - 1 ? 'Go to back cover' : 'Go to spread ' + (s + 1));
      var im = img('t/' + pad(s + 1) + '.jpg', ''); im.loading = 'lazy';
      var n = document.createElement('i'); n.textContent = pad(s + 1);
      t.appendChild(im); t.appendChild(n);
      t.addEventListener('click', function(){ goTo(s); });
      strip.appendChild(t); thumbs.push(t);
    })(s);
  }

  // Paper sounds, synthesised from filtered noise (no audio files).
  // page(): one sheet turning, a swish through the air and a soft landing.
  // riffle(): several sheets fanning past, ending in a heavier thud; used for jumps and for both covers.
  var Snd = (function(){
    var ctx = null, noise = null, master = null, on = true;
    try { on = localStorage.getItem('flipSound') !== 'off'; } catch (e) {}
    function ready(){
      if (!on) return false;
      try {
        if (!ctx){
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          ctx = new AC();
          var len = ctx.sampleRate * 2, d;
          noise = ctx.createBuffer(1, len, ctx.sampleRate);
          d = noise.getChannelData(0);
          for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
          master = ctx.createGain(); master.gain.value = 0.85; master.connect(ctx.destination);
        }
        if (ctx.state === 'suspended') ctx.resume();
        return true;
      } catch (e) { return false; }
    }
    // one shaped burst of noise: filter sweeps f0 -> f1 while the level rises to peak and dies away
    function burst(t, dur, type, f0, f1, q, peak, attack){
      var src = ctx.createBufferSource(); src.buffer = noise; src.loop = true;
      src.playbackRate.value = 0.8 + Math.random() * 0.4;
      var flt = ctx.createBiquadFilter(); flt.type = type; flt.Q.value = q;
      flt.frequency.setValueAtTime(f0, t); flt.frequency.exponentialRampToValueAtTime(f1, t + dur);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(flt); flt.connect(g); g.connect(master);
      src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
    }
    function page(ms){
      if (!ready()) return;
      var t = ctx.currentTime + 0.01, d = (ms || 850) / 1000, v = 0.9 + Math.random() * 0.2;
      burst(t, d * 0.46, 'bandpass', 800 * v, 3600 * v, 0.7, 0.30, d * 0.16);          // sheet sweeping through the air
      burst(t + d * 0.05, d * 0.30, 'highpass', 4500, 7500, 0.5, 0.09, d * 0.07);       // crisp rustle on top
      burst(t + d * 0.66, 0.07, 'bandpass', 2400 * v, 1300, 1.2, 0.20, 0.008);          // edge touching down
      burst(t + d * 0.66, 0.10, 'lowpass', 320, 120, 0.7, 0.26, 0.010);                 // soft pat of the sheet
    }
    function riffle(n, land){
      if (!ready()) return;
      var t = ctx.currentTime + 0.01, k;
      n = Math.max(3, Math.min(14, n));
      burst(t, n * 0.07 + 0.35, 'highpass', 2800, 5200, 0.4, 0.07, 0.10);               // continuous rustle under the fan
      for (k = 0; k < n; k++){
        burst(t + k * 0.07 + Math.random() * 0.015, 0.12, 'bandpass', 1700 + Math.random() * 1400, 4400, 1.0, 0.20, 0.012);
      }
      land = Math.max(land, n * 0.07 + 0.1);
      burst(t + land, 0.18, 'lowpass', 240, 80, 0.8, 0.55, 0.012);                      // the stack or cover landing
      burst(t + land, 0.07, 'bandpass', 1600, 900, 1.0, 0.20, 0.006);                   // slap on top of the thud
    }
    return {
      page: page, riffle: riffle,
      isOn: function(){ return on; },
      set: function(v){ on = v; try { localStorage.setItem('flipSound', v ? 'on' : 'off'); } catch (e) {} }
    };
  })();
  function isCover(i){ return i === 0 || i === L - 1; }

  var cur = 0;        // index of the open spread = number of leaves turned
  var W = 0;          // book width in px

  function setAngle(i, a){
    angle[i] = a;
    var el = leaves[i];
    el.style.transform = 'perspective(' + Math.round(W * 2.4) + 'px) rotateY(' + a.toFixed(2) + 'deg)';
    el.style.setProperty('--dim', (Math.sin(-a * Math.PI / 180) * 0.22).toFixed(3));
    if (moving[i]) el.style.zIndex = a > -90 ? 100 + (L - i) : 100 + i;
    if (i === 0 || i === L - 1) place();
  }
  // Keep whatever is on the table centred: a closed book is one page wide, an open one two.
  // The front cover sets the left extent and the back cover the right, so the slide follows the swing.
  function place(){
    var pw = W / 2;
    var le = Math.min(0, Math.cos(angle[0] * Math.PI / 180)) * pw;
    var re = Math.max(0, Math.cos(angle[L - 1] * Math.PI / 180)) * pw;
    book.style.transform = 'translateX(' + (-(le + re) / 2).toFixed(1) + 'px)';
    ground.style.left = (pw + le).toFixed(1) + 'px';
    ground.style.width = (re - le).toFixed(1) + 'px';
  }
  function settle(){
    for (var i = 0; i < L; i++){
      var el = leaves[i];
      if (!moving[i]){
        el.style.zIndex = i < cur ? 2 + i : 2 + (L - i);
        el.style.visibility = (i === 0 || i === L - 1 || (i >= cur - 2 && i <= cur + 1)) ? 'visible' : 'hidden';
      } else {
        el.style.visibility = 'visible';
      }
    }
    count.innerHTML = cur === 0 ? '<b>Front cover</b>' : cur === N - 1 ? '<b>Back cover</b>' : 'Spread <b>' + pad(cur + 1) + '</b> / ' + pad(N);

    prevBtn.disabled = cur === 0;
    nextBtn.disabled = cur === N - 1;
    thumbs.forEach(function(t, k){
      if (k === cur) t.setAttribute('aria-current', 'true'); else t.removeAttribute('aria-current');
    });
    var t = thumbs[cur];
    var target = t.offsetLeft - strip.offsetLeft - (strip.clientWidth - t.offsetWidth) / 2;
    try { strip.scrollTo({ left: target, behavior: reduce ? 'auto' : 'smooth' }); } catch (e) { strip.scrollLeft = target; }
  }
  function ease(t){ return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function animate(i, to, dur){
    cancelAnimationFrame(raf[i]);
    var from = angle[i];
    if (reduce || from === to){ moving[i] = false; setAngle(i, to); settle(); return; }
    dur = dur * Math.max(.35, Math.abs(to - from) / 180);
    moving[i] = true;
    var t0 = performance.now();
    settle();
    (function step(now){
      var t = Math.min(1, (now - t0) / dur);
      setAngle(i, from + (to - from) * ease(t));
      if (t < 1){ raf[i] = requestAnimationFrame(step); }
      else { moving[i] = false; settle(); }
    })(t0);
  }
  function home(i){ return i < cur ? -180 : 0; }   // where leaf i belongs for the current spread
  function goTo(target){
    target = Math.max(0, Math.min(N - 1, target));
    if (target === cur) return;
    var from = cur, k = 0, many = Math.abs(target - from) > 1;
    cur = target;
    var steps = Math.abs(target - from);
    var cover = from === 0 || target === 0 || from === N - 1 || target === N - 1;
    if (steps > 1) Snd.riffle(steps, ((steps - 1) * 70 + (cover ? 950 : 650)) * 0.78 / 1000);
    else if (cover) Snd.riffle(5, 0.74);
    else Snd.page(850);
    var run = function(i, delay){
      setTimeout(function(){ animate(i, home(i), (i === 0 || i === L - 1) ? 950 : many ? 650 : 850); }, delay);
    };
    if (target > from){ for (var i = from; i < target; i++) run(i, (k++) * 70); }
    else { for (var j = from - 1; j >= target; j--) run(j, (k++) * 70); }
    settle();
    hint.style.visibility = 'hidden';
  }

  // sizing: fit a 2:1 spread inside the stage
  function fit(){
    var sw = stage.clientWidth - 32 - 24, sh = stage.clientHeight - 44;
    // page height H; each side is artwork (H) + binding strip (2 x hole inset) + spine gap
    var G = 0.013, HI = 0.018, HR = 0.0068, K = 2 * (1 + 2 * HI + G);
    var H = Math.max(100, Math.min(sw / K, sh));
    W = Math.floor(H * K);
    book.style.width = W + 'px';
    book.style.height = H.toFixed(2) + 'px';
    book.style.setProperty('--g', (H * G).toFixed(2) + 'px');        // gap between sheet edge and spine
    book.style.setProperty('--hi', (H * HI).toFixed(2) + 'px');      // hole centre, in from the sheet edge
    book.style.setProperty('--hr', (H * HR).toFixed(2) + 'px');      // hole radius
    book.style.setProperty('--pitch', (H / RINGS).toFixed(3) + 'px');
    for (var i = 0; i < L; i++) if (!moving[i]) setAngle(i, home(i));
    applyZoom();
  }

  // drag or click to turn
  var drag = null;
  book.addEventListener('pointerdown', function(e){
    if (zoomed || e.button > 0) return;
    var r = book.getBoundingClientRect();
    var right = e.clientX > r.left + r.width / 2;
    var i = right ? cur : cur - 1;
    drag = { x: e.clientX, right: right, i: (i >= 0 && i < L) ? i : -1, moved: false, id: e.pointerId };
    try { book.setPointerCapture(e.pointerId); } catch (err) {}
  });
  book.addEventListener('pointermove', function(e){
    if (!drag || drag.i < 0 || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x;
    if (!drag.moved){
      if (Math.abs(dx) < 5) return;
      drag.moved = true;
      cancelAnimationFrame(raf[drag.i]);
      moving[drag.i] = true;
      book.classList.add('dragging');
      settle();
    }
    var base = drag.right ? 0 : -180;
    var a = base + dx / (W / 2 * 1.25) * 180;
    setAngle(drag.i, Math.max(-180, Math.min(0, a)));
  });
  function endDrag(e){
    if (!drag || (e && e.pointerId !== drag.id)) return;
    var d = drag; drag = null;
    book.classList.remove('dragging');
    if (d.i < 0) return;
    if (!d.moved){
      if (e && e.type === 'pointerup') goTo(cur + (d.right ? 1 : -1));
      return;
    }
    var a = angle[d.i], before = cur;
    if (d.right && a < -55) cur = d.i + 1;
    else if (!d.right && a > -125) cur = d.i;
    if (cur !== before){ if (isCover(d.i)) Snd.riffle(3, 0.5); else Snd.page(620); }
    animate(d.i, home(d.i), 700);
    hint.style.visibility = 'hidden';
  }
  book.addEventListener('pointerup', endDrag);
  book.addEventListener('pointercancel', endDrag);

  prevBtn.addEventListener('click', function(){ goTo(cur - 1); });
  nextBtn.addEventListener('click', function(){ goTo(cur + 1); });
  document.addEventListener('keydown', function(e){
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown'){ goTo(cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ goTo(cur - 1); e.preventDefault(); }
    else if (e.key === 'Home'){ goTo(0); e.preventDefault(); }
    else if (e.key === 'End'){ goTo(N - 1); e.preventDefault(); }
    else if (e.key === 'z' || e.key === 'Z'){ setZoom(!zoomed); }
    else if (e.key === 'Escape' && zoomed){ setZoom(false); }
  });

  // zoom: 2.2x, the view follows the pointer or finger
  var zoomed = false, Z = 2.2, zx = .5, zy = .5;
  function applyZoom(){
    if (!zoomed){ rig.style.transform = ''; return; }
    var ox = Math.max(0, W * Z - stage.clientWidth + 40);
    var oy = Math.max(0, W / 2 * Z - stage.clientHeight + 40);
    rig.style.transform = 'translate(' + ((.5 - zx) * ox).toFixed(1) + 'px,' + ((.5 - zy) * oy).toFixed(1) + 'px) scale(' + Z + ')';
  }
  function setZoom(on){
    zoomed = on;
    rig.classList.toggle('zoomed', on);
    zoomBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    zoomBtn.textContent = on ? 'Zoom out' : 'Zoom in';
    applyZoom();
  }
  zoomBtn.addEventListener('click', function(){ zx = zy = .5; setZoom(!zoomed); });
  stage.addEventListener('pointermove', function(e){
    if (!zoomed) return;
    var r = stage.getBoundingClientRect();
    zx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    zy = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    applyZoom();
  });
  var downAt = null;
  stage.addEventListener('pointerdown', function(e){ downAt = zoomed ? [e.clientX, e.clientY] : null; });
  stage.addEventListener('pointerup', function(e){
    if (zoomed && downAt && Math.abs(e.clientX - downAt[0]) + Math.abs(e.clientY - downAt[1]) < 6) setZoom(false);
    downAt = null;
  });

  var sndBtn = document.getElementById('sndBtn');
  function showSnd(){ sndBtn.textContent = 'Sound: ' + (Snd.isOn() ? 'on' : 'off'); }
  sndBtn.addEventListener('click', function(){ Snd.set(!Snd.isOn()); showSnd(); if (Snd.isOn()) Snd.page(850); });
  showSnd();

  fsBtn.addEventListener('click', function(){
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function(){ fsBtn.style.display = 'none'; });
    } catch (e) { fsBtn.style.display = 'none'; }
  });
  document.addEventListener('fullscreenchange', function(){
    fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
  });

  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);
  fit(); settle();
})();
</script>
</body>
</html>
